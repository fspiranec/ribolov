# Vodič kroz vrste: praktični savjeti (udice, mamci, tehnika, sezona).
# Ovo NISU pravila: to su okvirni savjeti za početnike i turiste.
# Minimalne veličine i lovostaji čitaju se iz /rules (min_sizes.yaml, closed_seasons.yaml).
# Slike i opisi dolaze s Wikipedije (npm run import:species -> data/species/wiki.json).
# lokalni_nazivi: okvirno, needs_check – nadopuniti po regijama (Istra, Kvarner, Dalmacija).
# Veličine udica su po europskoj numeraciji: veći broj = manja udica; 1/0, 2/0 ... su veće od 1.
napomena:
  hr: "Okvirni savjeti, ne pravila. Veličina udice ovisi o veličini ribe i mamca."
  en: "General tips, not rules. Hook size depends on the size of the fish and the bait."

vrste:
  - key: komarca
    naziv: { hr: "Komarča (orada)", en: "Gilthead seabream" }
    latinski: "Sparus aurata"
    lokalni_nazivi: ["orada", "lovrata (Dalmacija)", "podlanica (Istra, Kvarner)"]
    wiki: { hr: "Komarča", en: "Gilthead seabream" }
    min_kljuc: "komarča"
    udica: "4 – 1 (jaka, kratkog vrata)"
    mjeseci: [9, 10, 11]
    doba: [zora, sumrak]
    prepoznavanje:
      hr: "Srebrnasto tijelo, zlatna (orada!) poprečna traka između očiju i tamna mrlja na početku škržnog poklopca."
      en: "Silvery body, a golden band between the eyes and a dark spot at the start of the gill cover."
    mamci:
      hr: "dagnja, kozica, morski crv, mala obalna rakovica"
      en: "mussel, shrimp, sea worm, small shore crab"
    tehnika:
      hr: "Dubinski ribolov s obale (štap s olovom na dnu) ili najlonom bez štapa s broda. Orada oprezno uzima mamac – pričekaj da povuče."
      en: "Bottom fishing from the shore (rod with a sinker on the bottom) or a handline from a boat. Seabream bites cautiously – wait for a firm pull."
    kada:
      hr: "Najbolje u jesen (rujan–studeni), rano ujutro i predvečer."
      en: "Best in autumn (September–November), early morning and evening."
    gdje:
      hr: "Pjeskovito-kamenito dno, 2–15 m, uvale i ulazi u luke (pazi na zabrane u lukama i 50 m od uzgajališta školjkaša)."
      en: "Sandy-rocky bottom, 2–15 m, bays and harbour entrances (mind the bans in ports and within 50 m of shellfish farms)."

  - key: lubin
    naziv: { hr: "Lubin (brancin)", en: "European seabass" }
    latinski: "Dicentrarchus labrax"
    lokalni_nazivi: ["brancin"]
    wiki: { hr: "Lubin", en: "European seabass" }
    min_kljuc: "lubin"
    udica: "2 – 2/0"
    mjeseci: [10, 11, 12, 1, 2]
    doba: [sumrak, noc]
    prepoznavanje:
      hr: "Izduženo srebrno tijelo, dvije leđne peraje, tamna mrlja na rubu škržnog poklopca; velika usta."
      en: "Long silvery body, two dorsal fins, dark spot on the edge of the gill cover; big mouth."
    mamci:
      hr: "živa sitna riba, kozica, morski crv; umjetne varalice (vobler, gumena varalica)"
      en: "small live fish, shrimp, sea worm; lures (wobbler, soft plastic)"
    tehnika:
      hr: "Spinning s obale ili plovak. Voli valovito, mutnije more."
      en: "Spinning from the shore or float fishing. Likes rough, slightly murky water."
    kada:
      hr: "Jesen i zima, u sumrak i noću, nakon juga."
      en: "Autumn and winter, at dusk and at night, after a southerly (jugo) wind."
    gdje:
      hr: "Uz stijene na udaru valova, ušća rijeka i kanale (provjeri posebna staništa na ušćima)."
      en: "Rocks hit by waves, river mouths and channels (check special-habitat rules at river mouths)."

  - key: zubatac
    naziv: { hr: "Zubatac", en: "Common dentex" }
    latinski: "Dentex dentex"
    lokalni_nazivi: ["dental (Istra)"]
    wiki: { hr: "Zubatac", en: "Common dentex" }
    min_kljuc: "zubatac"
    udica: "2/0 – 5/0"
    mjeseci: [4, 5, 9, 10]
    doba: [zora, dan]
    prepoznavanje:
      hr: "Visoko tijelo ružičasto-sivih tonova s plavim točkicama, snažni očnjaci sprijeda."
      en: "Deep pinkish-grey body with small blue spots, strong canine teeth at the front."
    mamci:
      hr: "živa lignja, živa riba (gira, ušata), komad lignje"
      en: "live squid, live fish (picarel, saddled bream), squid strip"
    tehnika:
      hr: "Panula sa živim mamcem iz broda koji polako plovi, uz rub kamenitog dna."
      en: "Slow trolling with live bait from a boat along the edge of a rocky bottom."
    kada:
      hr: "Proljeće i jesen, rano jutro."
      en: "Spring and autumn, early morning."
    gdje:
      hr: "Kamenito dno i pošte na 15–50 m, rtovi i plićine na otvorenom."
      en: "Rocky bottoms and reefs at 15–50 m, headlands and offshore shoals."

