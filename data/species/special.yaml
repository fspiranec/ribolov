    naziv: { hr: "Srebrnopruga napuhača", en: "Silver-cheeked toadfish", de: "Silberstreifen-Kugelfisch", it: "Pesce palla maculato", pl: "Rozdymka srebrnopręga", cs: "Čtverzubec stříbropruhý", sl: "Srebrnoproga napihovalka" }
    latinski: "Lagocephalus sceleratus"
    wiki: ["Srebrnopruga napuhača", "Lagocephalus sceleratus"]   # [hr, en] naslov na Wikipediji
    recenica:
      hr: "Napuše se kad je izvadiš; meso i organi sadrže jak otrov koji se kuhanjem ne razgrađuje."
      en: "It puffs up when taken out; its flesh and organs contain a strong poison that cooking does not destroy."
    sto_uciniti:
      hr: "Nikako je ne jedi! Ima oštre zube – ne stavljaj prste blizu usta. Fotografiraj je i prijavi nalaz."
      en: "Never eat it! It has sharp teeth – keep your fingers away from its mouth. Take a photo and report it."
    razlog_ulov:
      hr: "Otrovna strana vrsta – nikako je ne jedi. Fotografiraj je i prijavi nalaz."
      en: "Poisonous non-native species – never eat it. Take a photo and report it."

