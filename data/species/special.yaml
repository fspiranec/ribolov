    needs_check: true
    naziv: { hr: "Plavi rak", en: "Atlantic blue crab", de: "Blaukrabbe", it: "Granchio blu", pl: "Krab błękitny", cs: "Krab modrý", sl: "Modra rakovica" }
    latinski: "Callinectes sapidus"
    wiki: ["Plavi rak", "Callinectes sapidus"]   # [hr, en] naslov na Wikipediji
    recenica:
      hr: "Strani rak s plavim kliještima koji se širi uz ušća rijeka i potiskuje domaće vrste."
      en: "A non-native crab with blue claws that is spreading near river mouths and pushing out native species."
    sto_uciniti:
      hr: "Smiješ ga zadržati – jestiv je. Pazi na snažna kliješta. Fotografiraj ga i prijavi nalaz."
      en: "You may keep it – it is edible. Mind the strong claws. Take a photo and report it."

