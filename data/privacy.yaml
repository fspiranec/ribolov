# Pravila privatnosti (stranica /privatnost). Pisano prema onome što aplikacija STVARNO radi (stanje 27. 11. 2026.).
# Kad se promijeni obrada podataka (nova usluga, analitika, računi…), ažuriraj tekst i datum `vrijedi_od`.
# Prijevodi DE/IT/PL/CS/SL su u locales/*.json (ključ = engleski tekst). {email} se zamjenjuje kontaktom ispod.
# Nije pravno pregledano – prije javne objave / Play Storea neka pogleda stručnjak za GDPR (TODO.md).
vrijedi_od: 2026-11-27
voditelj:
  ime: "Franjo Špiranec"
  email: "f.spiranec@gmail.com"

odjeljci:
  - naslov: { hr: "Ukratko", en: "In short" }
    tekst:
      hr: "Ne tražimo registraciju, ne koristimo kolačiće ni analitiku i ne prodajemo podatke. Tvoju lokaciju koristimo samo da bismo ti odgovorili za to mjesto i ne spremamo je."
      en: "We don't ask you to register, we use no cookies or analytics and we don't sell data. We use your location only to answer for that spot, and we don't store it."

  - naslov: { hr: "Lokacija", en: "Location" }
    tekst:
      hr: "Lokacija (s GPS-a ili točka koju odabereš na karti) šalje se našem poslužitelju samo kako bismo izračunali pravila, prognozu i najbliže prodavače i trgovine. Ne spremamo je i ne povezujemo s tobom. Poslužitelj s tim koordinatama dohvaća vrijeme (Open-Meteo) i dubinu mora (EMODnet); tvoja IP adresa tim servisima ne odlazi."
      en: "Your location (from GPS or a point you pick on the map) is sent to our server only to work out the rules, the forecast and the nearest sellers and shops. We don't store it or link it to you. With those coordinates the server fetches the weather (Open-Meteo) and sea depth (EMODnet); your IP address is not passed to those services."

  - naslov: { hr: "Podaci na tvom uređaju", en: "Data on your device" }
    tekst:
      hr: "Ulov, album, spremljena mjesta, odabrani prikaz i tema te zadnji odgovor (za rad bez interneta) spremaju se samo u pregledniku na tvom uređaju. Kad provjeravaš ulov, popis riba šalje se poslužitelju samo radi provjere i ne sprema se. Sve možeš obrisati brisanjem podataka ove stranice u postavkama preglednika."
      en: "Your catch, album, saved spots, chosen view and theme, and the last answer (for use offline) are stored only in the browser on your device. When you check your catch, the list of fish is sent to the server only for the check and is not stored. You can delete all of it by clearing this site's data in your browser settings."

  - naslov: { hr: "Poslužitelj (hosting)", en: "Server (hosting)" }
    tekst:
      hr: "Stranicu poslužuje Vercel Inc. iz podatkovnog centra u Frankfurtu. Kao svaki poslužitelj, Vercel kratko bilježi tehničke podatke o zahtjevima (IP adresa, vrijeme, adresa stranice, koja može sadržavati koordinate) radi rada i sigurnosti usluge, prema svojim pravilima privatnosti."
      en: "The site is served by Vercel Inc. from a data centre in Frankfurt. Like any server, Vercel briefly logs technical request data (IP address, time, page address, which may contain coordinates) to run and secure the service, under its own privacy policy."

  - naslov: { hr: "Vanjski sadržaji i poveznice", en: "External content and links" }
    tekst:
      hr: "Karta (OpenFreeMap, a kad nije dostupna OpenStreetMap) i slike riba (Wikimedia Commons) učitavaju se izravno s njihovih poslužitelja, koji tada vide tvoju IP adresu. Poveznice kao što su „Navigacija” (Google Maps), „Kupi dozvolu”, mRecFish ili „Prijavi nalaz” vode na vanjske stranice s vlastitim pravilima privatnosti."
      en: "The map (OpenFreeMap, or OpenStreetMap when that is unavailable) and fish photos (Wikimedia Commons) load directly from their servers, which then see your IP address. Links such as “Directions” (Google Maps), “Buy a licence”, mRecFish or “Report a sighting” lead to other websites with their own privacy policies."

  - naslov: { hr: "Zašto i koliko dugo", en: "Why and for how long" }
    tekst:
      hr: "Lokaciju obrađujemo samo zato što je to potrebno da bismo ti dali odgovor koji tražiš, i to samo dok se odgovor računa. Nema profiliranja ni automatiziranog odlučivanja o tebi."
      en: "We process your location only because it is needed to give you the answer you ask for, and only while that answer is being worked out. There is no profiling and no automated decision-making about you."

  - naslov: { hr: "Tvoja prava", en: "Your rights" }
    tekst:
      hr: "Imaš pravo na pristup, ispravak i brisanje podataka, ograničenje obrade i prigovor. Budući da tvoje podatke ne spremamo, većinu ih brišeš sam u pregledniku. Za pitanja piši na {email}. Možeš podnijeti i prigovor Agenciji za zaštitu osobnih podataka (azop.hr)."
      en: "You have the right to access, correct and delete data, to restrict processing and to object. As we don't store your data, you delete most of it yourself in your browser. For questions write to {email}. You can also complain to the Croatian Personal Data Protection Agency (azop.hr)."

  - naslov: { hr: "Promjene", en: "Changes" }
    tekst:
      hr: "Ako se ova pravila promijene, na vrhu stranice bit će naveden novi datum."
      en: "If this policy changes, the new date will be shown at the top of the page."
