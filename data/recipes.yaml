# Recepti za ribe koje turisti najčešće ulove s obale. Jednostavno, za apartman: najviše 5–6 sastojaka, bez posebne opreme.
# Ovo nisu pravila, nego prijedlozi. Prijevodi DE/IT/PL/CS/SL su u locales/*.json (ključ = engleski tekst).
#
# riba:        ključ vrste iz data/species/species.yaml ili special.yaml (za poveznicu „Kako je pripremiti”), ili null
# vrijeme_min: ukupno vrijeme pripreme u minutama
# istaknuto:   dobro_za_more – npr. invazivna vrsta: što je više pojedemo, to bolje za more
# autor, link: neobavezno – npr. lokalna konoba koja je dala recept
# ciscenje:    neobavezno – upute za čišćenje baš te ribe (prikazuju se u receptu)
#
# Zasad samo orada (vlasnik želi prvo vidjeti kako izgleda). Ostali recepti čekaju u recipes_kasnije.yaml.
zadnja_provjera: 2026-11-27

recepti:
  - key: orada_tava
    riba: komarca
    naziv: { hr: "Orada iz tave s češnjakom", en: "Pan-fried gilthead seabream with garlic" }
    vrijeme_min: 25
    autor: null
    link: null
    # upute za čišćenje baš ove ribe (prikazuju se u receptu, prije sastojaka)
    ciscenje:
      - { hr: "Prije čišćenja: oradu drži na hladnom. Leđna peraja ima oštre bodlje – odreži je škarama ili radi s krpom.", en: "Before cleaning, keep the seabream cold. The dorsal fin has sharp spines – cut it off with scissors or hold the fish with a cloth." }
      - { hr: "Ljuske: orada ima krupne, čvrste ljuske. Drži je za rep i hrptom noža ili žlicom struži od repa prema glavi, u vrećici ili pod mlazom vode. Ne zaboravi trbuh i dio uz peraje.", en: "Scales: seabream has large, tough scales. Hold it by the tail and scrape from tail to head with the back of a knife or a spoon, inside a bag or under running water. Don't forget the belly and around the fins." }
      - { hr: "Utroba: vrhom noža zareži trbuh od otvora kod repa do glave, izvadi utrobu i palcem sastruži tamnu krv uz kralježnicu.", en: "Guts: with the tip of a knife cut the belly from the vent to the head, remove the guts and scrape out the dark blood along the backbone with your thumb." }
      - { hr: "Škrge: škarama ih prereži gdje se spajaju ispod glave i izvuci – gorke su.", en: "Gills: cut them with scissors where they join under the head and pull them out – they are bitter." }
      - { hr: "Isperi oradu hladnom vodom iznutra i izvana i osuši je papirnatim ručnikom. Do pripreme je drži u hladnjaku.", en: "Rinse the seabream inside and out with cold water and pat it dry with a paper towel. Keep it in the fridge until you cook it." }
    sastojci:
      - { hr: "1–2 orade, očišćene", en: "1–2 gilthead seabream, cleaned" }
      - { hr: "maslinovo ulje", en: "olive oil" }
      - { hr: "2 češnja češnjaka", en: "2 garlic cloves" }
      - { hr: "peršin", en: "parsley" }
      - { hr: "limun", en: "lemon" }
      - { hr: "sol", en: "salt" }
    koraci:
      - { hr: "Posoli ribu iznutra i izvana, s obje strane napravi po dva plitka reza.", en: "Salt the fish inside and out and make two shallow cuts on each side." }
      - { hr: "Na srednjoj vatri peci je u ulju 6–8 minuta sa svake strane, dok se meso ne odvaja od kosti.", en: "Fry it in oil over medium heat for 6–8 minutes on each side, until the flesh comes away from the bone." }
      - { hr: "Pred kraj dodaj sitno sjeckani češnjak i peršin, a na tanjuru pokapaj limunom.", en: "Near the end add chopped garlic and parsley; squeeze lemon over it on the plate." }
    prica: { hr: "U Dalmaciji se kaže da riba mora plivati tri puta: u moru, u ulju i u vinu.", en: "In Dalmatia they say a fish must swim three times: in the sea, in oil and in wine." }
